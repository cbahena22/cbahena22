<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 908" role="img" aria-labelledby="t d">
<title id="t">How the work is trusted</title>
<desc id="d">An alert goes through seven steps: the agent reads with read-only tools, code checks every citation, an injection screen, an intel lookup, a person approves, and an audit trail records it. Each step names the repo that shows it.</desc>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}.h{font-size:30px;font-weight:700}.s{font-size:25px;fill:#374151}.r{font-size:23px;fill:#1d4ed8;font-weight:600}.a{stroke:#6b7280;stroke-width:3;fill:none}</style>
<rect width="880" height="908" rx="14" fill="#f6f8fa"/>
<rect x="24" y="20" width="832" height="102" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text class="h" x="44" y="54">1. An alert comes in</text>
<text class="s" x="44" y="83">a synthetic pilot: made-up alerts</text>
<text class="r" x="44" y="110">shown in: audited-soc-agent</text>
<path class="a" d="M440 122v20m-9-10l9 10 9-10"/>
<rect x="24" y="144" width="832" height="102" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text class="h" x="44" y="178">2. The agent reads</text>
<text class="s" x="44" y="207">read-only tools, nothing to change</text>
<text class="r" x="44" y="234">shown in: audited-soc-agent</text>
<path class="a" d="M440 246v20m-9-10l9 10 9-10"/>
<rect x="24" y="268" width="832" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="h" x="44" y="302">3. Code checks every citation</text>
<text class="s" x="44" y="331">the event exists and the quote is in it</text>
<text class="r" x="44" y="358">shown in: audited-soc-agent, runbook-cards</text>
<path class="a" d="M440 370v20m-9-10l9 10 9-10"/>
<rect x="24" y="392" width="832" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="h" x="44" y="426">4. Injection screen</text>
<text class="s" x="44" y="455">planted instructions are reported, not followed</text>
<text class="r" x="44" y="482">shown in: audited-soc-agent</text>
<path class="a" d="M440 494v20m-9-10l9 10 9-10"/>
<rect x="24" y="516" width="832" height="102" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="h" x="44" y="550">5. Intel lookup</text>
<text class="s" x="44" y="579">after the verdict, labelled, never used by it</text>
<text class="r" x="44" y="606">shown in: audited-soc-agent</text>
<path class="a" d="M440 618v20m-9-10l9 10 9-10"/>
<rect x="24" y="640" width="832" height="102" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text class="h" x="44" y="674">6. A person approves</text>
<text class="s" x="44" y="703">dry run (asa) / retyped commit id (abl)</text>
<text class="r" x="44" y="730">shown in: audited-soc-agent, agent-build-loop</text>
<path class="a" d="M440 742v20m-9-10l9 10 9-10"/>
<rect x="24" y="764" width="832" height="102" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
<text class="h" x="44" y="798">7. Audit trail</text>
<text class="s" x="44" y="827">hash chain: one changed byte fails</text>
<text class="r" x="44" y="854">shown in: audited-soc-agent</text>
</svg>